:root{--bg:#f6f8f4;--card:#fff;--fg:#1d2b22;--mute:#6b776f;--line:#e2e8df;--sin:#2f7d22;--no:#d98a00;--pend:#8a94a0;--metro:#1f5fbf}

*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:Figtree,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--fg);display:grid;grid-template-columns:380px 1fr;grid-template-rows:100%}
aside{display:flex;flex-direction:column;border-right:1px solid var(--line);background:var(--card);min-height:0}
header{padding:16px 16px 10px;border-bottom:1px solid var(--line)}
h1{font-size:1.05rem;margin:0 0 4px;font-weight:800;text-wrap:balance}
header p{margin:0;color:var(--mute);font-size:.8rem;line-height:1.4}
.flt{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.flt button{border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:20px;padding:5px 10px;font:inherit;font-size:.78rem;cursor:pointer;display:flex;align-items:center;gap:6px}
.flt button.on{border-color:var(--fg);font-weight:600}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex-shrink:0}
ol{list-style:none;margin:0;padding:0;overflow:auto;flex:1}
li{display:flex;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);cursor:pointer}
li:hover,li.act{background:color-mix(in srgb,var(--sin) 8%,transparent)}
.num{width:26px;height:26px;border-radius:50%;color:#fff;font-size:.75rem;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.inf{min-width:0;flex:1}.inf b{display:block;font-size:.88rem}.inf small{display:block;color:var(--mute);font-size:.76rem;margin-top:2px}
.km{font-variant-numeric:tabular-nums;font-size:.8rem;font-weight:600;white-space:nowrap}
#map{height:100%;min-height:0}
.pin{border-radius:50%;color:#fff;font:800 11px Figtree,system-ui,sans-serif;display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.leaflet-popup-content{font-family:Figtree,system-ui,sans-serif;font-size:.82rem;line-height:1.45;margin:12px 14px}
.leaflet-popup-content b{font-size:.92rem}
.leaflet-popup-content a{color:var(--metro)}
@media (max-width:760px){body{grid-template-columns:1fr;grid-template-rows:58vh 42vh}aside{order:2;border-right:none;border-top:1px solid var(--line)}#map{order:1}header{padding:12px 16px 8px}}
</style>
